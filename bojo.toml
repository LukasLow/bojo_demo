schema = 1

[project]
name    = "bojo_demo"
version = "0.1.0"
entry   = "main.mojo"

[version]
mojo = "1.2.0"

[build]
output = "dir"
strip  = true

[deps-from."https://github.com/LukasLow/bojo_demo_math"]
version = "v0.1.0"

[deps-from."https://github.com/LukasLow/bojo_demo_hello"]
version = "v0.1.0"

# Only the project may shorten a name, and only here, keyed by module path.
[alias]
"gh.LukasLow.bojo_demo_math" = "mathx"
