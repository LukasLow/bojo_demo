schema = 1
[project]
name    = "bojo_demo"
version = "0.1.0"
entry   = "main.mojo"

[version]
mojo   = "1.2.0"
python = "3.12"

[build]
output  = "onefile"
strip   = true
include = [".bojo/gen"]

[linker]
libdirs = [".bojo/native"]
libs    = ["cprint", "rssum"]

[deps.python]
numpy = "2.1.0"

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "addition/v0.0.2"
libs = ["addition"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "cprint/v0.0.1"
libs = ["cprint"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "randomname/v0.0.1"
libs = ["randomname"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "rssum/v0.0.1"
libs = ["rssum"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "a/v0.0.1"
libs = ["a"]

[hooks]
pre-build = [
  ["sh", "-c", "mkdir -p .bojo/native && cc -shared -fPIC -O2 -o .bojo/native/libcprint.so vendor/mojo/pkgs/cprint/cprint.c"],
  ["sh", "-c", "cargo build --release --manifest-path vendor/mojo/pkgs/rssum/Cargo.toml --target-dir .bojo/native/cargo && cp .bojo/native/cargo/release/librssum.so .bojo/native/"],
]
