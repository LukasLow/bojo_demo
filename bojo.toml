schema = 1
[project]
name    = "bojo_demo"
version = "0.1.0"
entry   = "main.mojo"

[version]
mojo   = "1.2.0"
python = "3.12"

[build]
output  = "onefile"
strip   = true
include = [".bojo/gen"]

[linker]
libdirs = [".bojo/native"]
libs    = ["cprint", "rssum", "request", "tls"]

[deps.python]
numpy = "2.1.0"

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "addition@v0.0.2"
libs = ["addition"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "a@v0.0.1"
libs = ["a"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "cprint@v0.0.1"
libs = ["cprint"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "randomname@v0.0.1"
libs = ["randomname"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "rssum@v0.0.1"
libs = ["rssum"]

[[deps-from]]
repo = "https://github.com/LukasLow/bojo_demo_pkg"
tag  = "tls@v0.0.1"
libs = ["tls"]

[[deps-from]]
repo = "https://github.com/LukasLow/mojolib"
tag  = "request@v0.0.1"
libs = ["request"]

[alias]
addition = "mathx"

[hooks]
pre-build = [
  ["sh", "-c", "mkdir -p .bojo/native && case \"$(uname -s)\" in Darwin) L=-lcurl;; *) L=-l:libcurl.so.4;; esac; cc -shared -fPIC -O2 -o .bojo/native/librequest.so .vendor/github/com/LukasLow/mojolib/request/request.c $L"],
  ["sh", "-c", "mkdir -p .bojo/native && cc -shared -fPIC -O2 -o .bojo/native/libcprint.so .vendor/github/com/LukasLow/bojo_demo_pkg/cprint/cprint.c"],
  ["sh", "-c", "cargo build --release --manifest-path .vendor/github/com/LukasLow/bojo_demo_pkg/rssum/Cargo.toml --target-dir .bojo/native/cargo && cp .bojo/native/cargo/release/librssum.so .bojo/native/"],
  ["sh", "-c", "cargo build --release --manifest-path .vendor/github/com/LukasLow/bojo_demo_pkg/tls/Cargo.toml --target-dir .bojo/native/cargo-tls && cp .bojo/native/cargo-tls/release/libtls.so .bojo/native/"],
]
